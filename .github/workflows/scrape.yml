name: Scrape
on:
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'

jobs:
  scrape:
    name: Scrape
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup
        run: uv sync
        shell: bash

      - id: make
        name: Run scrape command
        run: |
          uv run noaawildfires hms-fires > data/hms-fires.json
          uv run noaawildfires hms-smoke > data/hms-smoke.json
        shell: bash

      - name: Datestamp
        run: date > data/timestamp.txt
        shell: bash

      - id: commit
        name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git config pull.rebase false
          git status
          git pull origin $GITHUB_REF
          git add ./data
          git commit -m "Scrape" && git push || true
        shell: bash
