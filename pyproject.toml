[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "noaa-wildfires"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "click",
    "geojson",
    "pyshp",
    "requests",
]
authors = [{ name = "Ben Welsh", email = "b@palewi.re" }]
description = "Download wildfires data from NOAA satellites"
keywords = ["wildfires", "noaa", "hms", "smoke", "geojson", "data"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://palewi.re/docs/noaa-wildfires/"
Source = "https://github.com/datadesk/noaa-wildfires"
Issues = "https://github.com/datadesk/noaa-wildfires/issues"

[project.scripts]
noaawildfires = "noaa_wildfires.cli:cmd"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "setuptools-scm",
    "twine",
    "ty",
]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-palewire-theme",
]

[tool.setuptools]
packages = ["noaa_wildfires"]

[tool.setuptools.package-data]
noaa_wildfires = ["py.typed"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = [
    "live: talks to the real NOAA website, so it can be slow or fail when NOAA is down",
]

[tool.coverage.run]
source = ["noaa_wildfires"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "if __name__ == .__main__.:",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["noaa_wildfires"]
